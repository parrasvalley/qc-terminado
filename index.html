<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="version" content="20260623000104">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QC Terminado - Parras Valley</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#030712;color:#f0ece6;font-family:system-ui,sans-serif;}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
    select option{background:#0a1628;}
    ::-webkit-scrollbar{width:20px;}
    ::-webkit-scrollbar-track{background:rgba(255,255,255,0.04);}
    ::-webkit-scrollbar-thumb{background:rgba(34,197,94,0.5);border-radius:10px;border:4px solid transparent;background-clip:padding-box;}
    ::-webkit-scrollbar-thumb:hover{background:rgba(34,197,94,0.7);background-clip:padding-box;}
    @media(min-width:900px){
      .qct-grid4{gap:10px !important;}
      input,select,button{font-size:inherit;}
    }
    @media(max-width:480px){
      .qct-grid4{gap:5px !important;}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
var useState=React.useState;
var useEffect=React.useEffect;

var PIN_QCT = "2020";

function ModalPinQCT(props){
  var s1=React.useState(""); var vp=s1[0]; var svp=s1[1];
  var s2=React.useState(false); var errp=s2[0]; var serrp=s2[1];
  function okp(){if(vp===PIN_QCT){svp("");serrp(false);props.onOk();}else{serrp(true);svp("");}}
  var isGate=props.hideCancel;
  var inner=(
    <div style={{background:"#0a1a0a",border:"2px solid rgba(34,197,94,0.3)",borderRadius:16,padding:32,maxWidth:300,width:"100%",textAlign:"center"}}>
      <div style={{fontSize:isGate?18:25,fontWeight:900,color:"#f0f0e8",marginBottom:6}}>{isGate?"Ingresa tu PIN":"Acceso de editor"}</div>
      {!isGate&&<div style={{fontSize:20,color:"#4a7a54",marginBottom:20}}>PIN para registrar</div>}
      <input autoFocus={isGate} type="number" value={vp} onChange={function(e){svp(e.target.value.slice(0,8));serrp(false);}} placeholder="PIN"
        onKeyDown={function(e){if(e.key==="Enter")okp();}}
        style={{width:"100%",background:"rgba(0,0,0,0.4)",border:"2px solid "+(errp?"#f87171":"rgba(34,197,94,0.3)"),borderRadius:10,padding:"12px",color:"#22c55e",fontFamily:"Georgia,serif",fontSize:36,textAlign:"center",outline:"none",marginBottom:errp?8:16,letterSpacing:6}}/>
      {errp&&<div style={{fontSize:20,fontWeight:800,color:"#f87171",marginBottom:12}}>PIN incorrecto</div>}
      <div style={{display:"flex",gap:10}}>
        {!isGate&&<button onClick={props.onCancel} style={{flex:1,padding:"11px",background:"rgba(255,255,255,0.05)",border:"2px solid rgba(255,255,255,0.1)",borderRadius:9,color:"#6b7280",fontSize:21,fontWeight:700,cursor:"pointer",fontFamily:"system-ui"}}>Cancelar</button>}
        <button onClick={okp} style={{flex:1,padding:"14px",background:"linear-gradient(135deg,#16a34a,#22c55e)",border:"none",borderRadius:9,color:"#052e16",fontSize:21,fontWeight:900,cursor:"pointer",fontFamily:"system-ui"}}>Entrar</button>
      </div>
    </div>
  );
  if(isGate)return inner;
  return (
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.9)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      {inner}
    </div>
  );
}



function ModalEditarEval(props){
  var ev=props.ev, producto=props.producto, presentacion=props.presentacion, clienteEd=props.cliente;
  var es20 = presentacion==="20lb"||presentacion==="25lb"||presentacion==="50lb";
  var esBolsas = presentacion==="12x1"||presentacion==="8x2"||presentacion==="12x1lb"||presentacion==="12x8oz";
  var es18lb = presentacion==="18lb";
  var esCustomPackEuro = producto==="Europeo" && presentacion==="12ct" && clienteEd==="Custom Pack";
  var defsList = defectosPorProducto(producto);

  var s0=React.useState(ev.rancho||""); var rancho=s0[0],setRancho=s0[1];
  var s1=React.useState(ev.malla||""); var malla=s1[0],setMalla=s1[1];
  var s2=React.useState(ev.empacador||""); var empacador=s2[0],setEmpacador=s2[1];
  var s3=React.useState(ev.peso!=null?String(ev.peso):""); var peso=s3[0],setPeso=s3[1];
  var s4=React.useState(ev.piezas!=null?String(ev.piezas):""); var piezas=s4[0],setPiezas=s4[1];
  var s5=React.useState(ev.primera!=null?String(ev.primera):""); var primera=s5[0],setPrimera=s5[1];
  var s6=React.useState(ev.segunda!=null?String(ev.segunda):""); var segunda=s6[0],setSegunda=s6[1];
  var s7=React.useState(ev.tercera!=null?String(ev.tercera):""); var tercera=s7[0],setTercera=s7[1];
  var s8=React.useState(ev.merma!=null?String(ev.merma):""); var merma=s8[0],setMerma=s8[1];
  var s9=React.useState(Object.assign({},ev.defs||{})); var defs=s9[0],setDefs=s9[1];
  var s10=React.useState(Object.assign({},ev.recs||{})); var recs=s10[0],setRecs=s10[1];
  var s11=React.useState(ev.bolsas?ev.bolsas.map(function(b){return Object.assign({},b);}):[]); var bolsas=s11[0],setBolsas=s11[1];

  var total=nv(primera)+nv(segunda)+nv(tercera)+nv(merma);
  var pPri=pct(nv(primera),total);

  function setDefV(k,v){setDefs(function(d){var n=Object.assign({},d);n[k]=v;return n;});}
  function setRecV(k,v){setRecs(function(r){var n=Object.assign({},r);n[k]=v;return n;});}
  function setBolsaV(i,k,v){setBolsas(function(bs){var n=bs.slice();n[i]=Object.assign({},n[i]);n[i][k]=v;return n;});}

  var inpE={width:"100%",border:"1px solid rgba(255,255,255,0.15)",borderRadius:6,padding:"8px",background:"rgba(0,0,0,0.35)",color:"#f0ece6",fontFamily:"system-ui,sans-serif",fontSize:16,outline:"none",textAlign:"center"};
  var lblE={fontSize:12,color:"#7a8699",textTransform:"uppercase",letterSpacing:1,marginBottom:4,fontWeight:700};

  function guardar(){
    var bolsasDatos=bolsas.filter(function(b){return nv(b.peso)>0;});
    var avgPeso=bolsasDatos.length>0?bolsasDatos.reduce(function(s,b){return s+nv(b.peso);},0)/bolsasDatos.length:0;
    var avgPiezas=bolsasDatos.length>0?bolsasDatos.reduce(function(s,b){return s+nv(b.piezas);},0)/bolsasDatos.length:0;
    var bajoPeso20 = es20 && nv(peso)>0 && nv(peso)<(PESO_MIN["20lb"]||0);
    var bajoPesoBolsas = (esBolsas && BOLSAS_SIN_RECHAZO_PESO.indexOf(presentacion)===-1) ? bolsas.filter(function(b){return nv(b.peso)>0&&nv(b.peso)<(PESO_MIN[presentacion]||0);}).length : 0;
    var bajoPesoCustomPack = esCustomPackEuro && nv(peso)>0 && nv(peso)<PESO_MIN_LB_EUROPEO_CUSTOMPACK;
    var piezasBajasCustomPack = esCustomPackEuro && nv(piezas)>0 && nv(piezas)<PIEZAS_MIN_EUROPEO_CUSTOMPACK;
    var nuevo=Object.assign({},ev,{
      rancho:rancho,malla:malla,empacador:empacador,
      peso:nv(peso),piezas:nv(piezas),
      primera:nv(primera),segunda:nv(segunda),tercera:nv(tercera),merma:nv(merma),
      total:total,pPri:pPri,
      defs:defs,recs:recs,
      bolsas:esBolsas?bolsas:null,
      avgPeso:avgPeso,avgPiezas:avgPiezas,
      bajoPeso20:bajoPeso20,bajoPesoBolsas:bajoPesoBolsas,
      bajoPesoCustomPack:bajoPesoCustomPack,piezasBajasCustomPack:piezasBajasCustomPack
    });
    props.onSave(nuevo);
  }

  return (
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.88)",zIndex:998,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:16,overflowY:"auto"}}>
      <div style={{background:"#0a1220",border:"2px solid rgba(59,130,246,0.4)",borderRadius:14,padding:20,maxWidth:520,width:"100%",margin:"20px auto"}}>
        <div style={{fontSize:20,fontWeight:900,color:"#f0ece6",marginBottom:2}}>Editar muestreo</div>
        <div style={{fontSize:13,color:"#4a5568",marginBottom:14,textTransform:"uppercase",letterSpacing:1}}>{producto} {presentacion}</div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
          <div><div style={lblE}>Rancho</div><input style={inpE} value={rancho} onChange={function(e){setRancho(e.target.value);}}/></div>
          <div><div style={lblE}>Malla</div><input style={inpE} value={malla} onChange={function(e){setMalla(e.target.value);}}/></div>
          <div><div style={lblE}>Empacador</div><input style={inpE} value={empacador} onChange={function(e){setEmpacador(e.target.value);}}/></div>
        </div>

        {(es20||es18lb)&&(
          <div style={{marginBottom:10}}>
            <div style={lblE}>Peso caja</div>
            <input style={inpE} type="number" value={peso} onChange={function(e){setPeso(e.target.value);}}/>
          </div>
        )}
        {esCustomPackEuro&&(
          <div style={{marginBottom:10}}>
            <div style={lblE}>Peso caja (lb)  Obligatorio  minimo 10 lb</div>
            <input style={inpE} type="number" step="0.01" value={peso} onChange={function(e){setPeso(e.target.value);}}/>
          </div>
        )}
        {!es18lb&&!esBolsas&&(
          <div style={{marginBottom:10}}>
            <div style={lblE}>Piezas en caja{esCustomPackEuro?"  (minimo 12)":""}</div>
            <input style={inpE} type="number" value={piezas} onChange={function(e){setPiezas(e.target.value);}}/>
          </div>
        )}
        {esBolsas&&(
          <div style={{marginBottom:10}}>
            <div style={lblE}>Total piezas caja</div>
            <input style={inpE} type="number" value={piezas} onChange={function(e){setPiezas(e.target.value);}}/>
          </div>
        )}

        {!es18lb&&(<>
          <div style={{fontSize:13,color:"#4a5568",textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Calidades{total>0?"  ("+pPri+"% primera)":""}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:12}}>
            {[["primera","1ra",primera,setPrimera],["segunda","2da",segunda,setSegunda],["tercera","3ra",tercera,setTercera],["merma","Merma",merma,setMerma]].map(function(x){return (
              <div key={x[0]}>
                <div style={lblE}>{x[1]}</div>
                <input style={inpE} type="number" min="0" value={x[2]} onChange={function(e){x[3](e.target.value);}}/>
              </div>
            )})}
          </div>

          <div style={{fontSize:13,color:"#4a5568",textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Defectos</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:12}}>
            {defsList.map(function(d){return (
              <div key={d} style={{display:"flex",alignItems:"center",gap:6,background:"rgba(0,0,0,0.25)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:6,padding:"6px 8px"}}>
                <span style={{fontSize:14,flex:1,color:"#bfdbfe"}}>{d}</span>
                <input style={{width:44,border:"none",borderBottom:"1px solid rgba(255,255,255,0.2)",background:"transparent",color:"#f0ece6",fontFamily:"monospace",fontSize:16,fontWeight:700,textAlign:"center",outline:"none"}} type="number" min="0" value={defs[d]||""} onChange={function(e){setDefV(d,e.target.value);}}/>
              </div>
            )})}
          </div>

          <div style={{fontSize:13,color:"#4a5568",textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Rechazo automatico</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:12}}>
            {RECHAZOS.map(function(r){return (
              <div key={r} style={{background:"rgba(0,0,0,0.25)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:6,padding:"6px 8px",textAlign:"center"}}>
                <div style={{fontSize:13,color:"#fca5a5",marginBottom:3}}>{r}</div>
                <input style={{width:"100%",border:"none",borderBottom:"1px solid rgba(255,255,255,0.2)",background:"transparent",color:"#f0ece6",fontFamily:"monospace",fontSize:16,fontWeight:700,textAlign:"center",outline:"none"}} type="number" min="0" value={(recs&&recs[r])||""} onChange={function(e){setRecV(r,e.target.value);}}/>
              </div>
            )})}
          </div>
        </>)}

        {esBolsas&&bolsas.length>0&&(<>
          <div style={{fontSize:13,color:"#4a5568",textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Bolsas</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:12}}>
            {bolsas.map(function(b,i){return (
              <div key={i} style={{background:"rgba(0,0,0,0.25)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:6,padding:"5px"}}>
                <div style={{fontSize:12,color:"#4a5568",marginBottom:2}}>B{b.num}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:3}}>
                  <div><div style={{fontSize:11,color:"#4a5568"}}>g</div><input style={{width:"100%",border:"none",borderBottom:"1px solid rgba(255,255,255,0.2)",background:"transparent",color:"#f0ece6",fontFamily:"monospace",fontSize:15,fontWeight:700,outline:"none"}} type="number" value={b.peso} onChange={function(e){setBolsaV(i,"peso",e.target.value);}}/></div>
                  <div><div style={{fontSize:11,color:"#4a5568"}}>pzas</div><input style={{width:"100%",border:"none",borderBottom:"1px solid rgba(255,255,255,0.2)",background:"transparent",color:"#f0ece6",fontFamily:"monospace",fontSize:15,fontWeight:700,outline:"none"}} type="number" value={b.piezas} onChange={function(e){setBolsaV(i,"piezas",e.target.value);}}/></div>
                </div>
              </div>
            )})}
          </div>
        </>)}

        <div style={{display:"flex",gap:8,marginTop:6}}>
          <button onClick={props.onCancel} style={{flex:1,padding:12,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"#94a3b8",fontWeight:700,fontSize:16,cursor:"pointer",fontFamily:"system-ui"}}>Cancelar</button>
          <button onClick={guardar} style={{flex:1,padding:12,background:"linear-gradient(135deg,#1d4ed8,#3b82f6)",border:"none",borderRadius:8,color:"#fff",fontWeight:900,fontSize:16,cursor:"pointer",fontFamily:"system-ui"}}>Guardar cambios</button>
        </div>
      </div>
    </div>
  );
}

// Estructura: Producto -> Presentaciones -> Clientes
var CATALOGO = {
  "Persa": {
    emoji:"", color:"#16a34a", bg:"#052e16",
    pres:{
      "20lb":  ["Mama Mia","Perfresh","4 Earth","Pure Flavor","Generica"],
      "12x1":  ["Lakeway","DQP","Nature Sweet","Pero Family","Wholesum","4 Earth","Pure Flavor","Generica"],
      "8x2":   ["4 Earth","Generica"],
    }
  },
  "Europeo": {
    emoji:"", color:"#7c3aed", bg:"#2e1065",
    pres:{
      "12ct":       ["Wholesum","DQP","Custom Pack","Produce Team","Perfresh"],
      "24ct":       ["DQP","Lakeway","Produce Team"],
      "1/9 bushel": ["Mercado","Custom Pack","Perfresh"],
    }
  },
  "Slicer": {
    emoji:"", color:"#0284c7", bg:"#082f49",
    pres:{
      "18ct":  ["Generica"],
      "24ct":  ["Generica"],
      "36ct":  ["Lakeway","Perfresh","Pero Family","Produce Team"],
      "25lb":  ["Wholesum"],
      "50lb":  ["Wholesum","Perfresh"],
      "62ct":  ["Lakeway"],
    }
  },
  "Morron": {
    emoji:"M", color:"#dc2626", bg:"#450a0a",
    variantes:["Rojo","Amarillo","Naranja","Verde"],
    pres:{
      "11lb":["Wholesum","Pero Family","Perfresh","Nature Sweet"],
      "12x2":["Wholesum","Pero Family","Perfresh","Nature Sweet"],
      "1/9 bushel":["Wholesum","Pero Family","Perfresh","Nature Sweet"],

    }
  },
  "Minibel": {
    emoji:"", color:"#ea580c", bg:"#431407",
    pres:{
      "12x8oz": ["Perfresh","Nature Sweet","Pero Family"],
      "12x1lb": ["Perfresh","Nature Sweet","Pero Family"],
      "18lb":   ["Perfresh","Nature Sweet","Pero Family"]
    }
  },
};
var PRODUCTOS_CAT = Object.keys(CATALOGO);
var DEFECTOS = ["Deforme","Cicatriz","Dano mecanico","Trips","Fuera de tamano","Flacido","Amarillo","Gusano","Mal cierre"];
var DEFECTOS_MORRON = ["Deforme","Cicatriz","Dano mecanico","Trips","Fuera de tamano","Flacido","Fumagina","Gusano","Verde","Sucio"];
var DEFECTOS_EUROPEO = ["Deforme","Cicatriz","Dano mecanico","Trips","Fuera de tamano","Flacido","Amarillo","Gusano","Mal cierre","Mal emplaye"];
var DEFECTOS_PERSA_SLICER = DEFECTOS.concat(["Dano en pedunculo","Flor"]);
var RECHAZOS = ["Pudricion","Mal etiquetado"];
function defectosPorProducto(producto){
  if(producto==="Morron") return DEFECTOS_MORRON;
  if(producto==="Europeo") return DEFECTOS_EUROPEO;
  if(producto==="Persa"||producto==="Slicer") return DEFECTOS_PERSA_SLICER;
  return DEFECTOS;
}
var TODOS_DEFECTOS_COLS = (function(){
  var vistos={},out=[];
  DEFECTOS.concat(DEFECTOS_MORRON,DEFECTOS_EUROPEO,DEFECTOS_PERSA_SLICER).forEach(function(d){
    if(!vistos[d]){vistos[d]=1;out.push(d);}
  });
  return out;
})();
function csvCell(v){
  if(v===undefined||v===null) v="";
  v=String(v);
  if(/[",\n]/.test(v)) v='"'+v.replace(/"/g,'""')+'"';
  return v;
}
function descargarCSV(filename,content){
  var blob=new Blob(["﻿"+content],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
var PESO_MAX = {"20lb":9.3,"12x1":480,"8x2":950,"25lb":11.66,"50lb":23.31,"12x1lb":480,"12x8oz":240,"18lb":18.5};
var PESO_MIN = {"20lb":9.2,"12x1":470,"8x2":940,"25lb":11.57,"50lb":23.13,"12x1lb":470,"12x8oz":235,"18lb":18.2};
var PESO_MIN_LB_EUROPEO_CUSTOMPACK = 10; // Europeo 12ct - Custom Pack: peso minimo obligatorio en lb
var PIEZAS_MIN_EUROPEO_CUSTOMPACK = 12; // Europeo 12ct - Custom Pack: piezas minimo (sin maximo)
var BOLSAS_SIN_RECHAZO_PESO = ["8x2","12x1","12x1lb","12x8oz"]; // embolsados de Persa (8x2, 12x1) y Minibel (12x1lb, 12x8oz): guardar el muestreo no se restringe/marca como rechazo aunque no se cumpla el peso minimo o maximo

var FB_QCT="https://parrasvalley-default-rtdb.firebaseio.com";
function lsSave(k,v){
  try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}
  try{fetch(FB_QCT+"/"+k+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});}catch(e){}
}
function lsLoad(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function fbLoadQCT(k,setter,def){
  fetch(FB_QCT+"/"+k+".json").then(function(r){return r.ok?r.json():null;}).then(function(data){
    if(data!==null&&data!==undefined) setter(data);
  }).catch(function(){});
}
function nv(v){var x=parseFloat(v);return isNaN(x)?0:x;}
function f1(v){return isNaN(v)||!isFinite(v)?"0.0":Number(v).toFixed(1);}
function pct(n,t){return t>0?Math.round((n/t)*100):0;}
function esPresBolsas(pres){return pres==="12x1"||pres==="8x2"||pres==="12x1lb"||pres==="12x8oz";}
// Peso a usar para calcular giveaway de una evaluacion ya guardada: en presentaciones embolsadas
// el peso de caja no se captura (solo el peso de cada bolsa), por lo que se usa el promedio de bolsas.
function pesoGiveawayEv(e,pres){return esPresBolsas(pres)?(e.avgPeso||0):(e.peso||0);}

function semCal(p){
  if(p>=95) return {c:"#22c55e",bg:"#052e16",lbl:"APROBADO",icon:""};
  if(p>=91) return {c:"#f59e0b",bg:"#451a03",lbl:"CUIDADO",icon:"!"};
  return {c:"#ef4444",bg:"#450a0a",lbl:"PROBABLE RECHAZO",icon:"X"};
}
function esCPEuro12(producto,tipo,cliente){
  return producto==="Europeo" && tipo==="12ct" && cliente==="Custom Pack";
}
function unidadPeso(producto,tipo,cliente){
  if(tipo==="20lb"||tipo==="25lb"||tipo==="50lb") return "kg";
  if(esCPEuro12(producto,tipo,cliente)) return "lb";
  return "g";
}
function semPeso(p,tipo,producto,cliente){
  if(esCPEuro12(producto,tipo,cliente)){
    if(p===0) return {c:"#4a5568",lbl:""};
    if(p<PESO_MIN_LB_EUROPEO_CUSTOMPACK) return {c:"#ef4444",lbl:"BAJO"};
    return {c:"#22c55e",lbl:"OK"};
  }
  var min=PESO_MIN[tipo]||0, max=PESO_MAX[tipo]||999;
  if(p===0) return {c:"#4a5568",lbl:""};
  if(p<min) return {c:"#ef4444",lbl:"BAJO"};
  if(p>max) return {c:"#f59e0b",lbl:"ALTO"};
  return {c:"#22c55e",lbl:"OK"};
}
function semPiezas(p){
  if(p===0) return {c:"#4a5568"};
  if(p<5) return {c:"#ef4444"};
  if(p>8) return {c:"#f59e0b"};
  return {c:"#22c55e"};
}
function regalo(p,tipo){
  if(!PESO_MAX.hasOwnProperty(tipo)) return null; // presentaciones sin objetivo maximo (ej. conteo: 12ct, 24ct, 1/9 bushel) no aplican giveaway
  var max=PESO_MAX[tipo];
  if(!p||p<=max) return null;
  var gPorBolsa=Math.round(p-max);
  var numBolsas=tipo==="8x2"?8:tipo==="12x1"?12:tipo==="12x1lb"?12:tipo==="12x8oz"?12:1;
  var g=tipo==="20lb"?Math.round((p-max)*1000):gPorBolsa*numBolsas;
  var totalMax=max*numBolsas;
  var pctG=(g/totalMax*100).toFixed(1);
  return {g, gPorBolsa:tipo==="20lb"?null:gPorBolsa, pctG, numBolsas};
}

function initForm(pres){
  var defs={};DEFECTOS.forEach(function(d){defs[d]="";});
  var recs={};RECHAZOS.forEach(function(r){recs[r]="";});
  var n=pres==="8x2"?8:12;
  var bolsas=[];
  for(var i=0;i<n;i++){bolsas.push({num:i+1,peso:"",piezas:""});}
  return {rancho:"PVT",malla:"",peso:"",piezas:"",primera:"",segunda:"",tercera:"",merma:"",empacador:"",defs:defs,recs:recs,bolsas:bolsas};
}

  // ---- Exportar CSV (respeta filtros de cliente/producto/presentacion) ----
  function construirFilaCSV(estado,p,e,fechaRef){
    var fila={
      Estado:estado, Fecha:fechaRef||p.fecha||"", Cliente:p.cliente, Producto:p.producto||"", Presentacion:p.presentacion,

      Total:e.total||"", "%Primera":e.pPri!=null?e.pPri:"",
      BajoPeso20:e.bajoPeso20?"Si":"", BolsasBajoPeso:e.bajoPesoBolsas||"",
      BajoPesoCustomPack:e.bajoPesoCustomPack?"Si":"", PiezasBajasCustomPack:e.piezasBajasCustomPack?"Si":"",

    RECHAZOS.forEach(function(r){fila[r]=(e.recs&&e.recs[r])?e.recs[r]:"";});
    return fila;
  }

    });
    if(!filas.length){alert("No hay muestreos para exportar con los filtros actuales");return;}
    var headers=["Estado","Fecha","Cliente","Producto","Presentacion","Variante","Rancho","Malla","Empacador","Peso","PiezasCaja","Primera","Segunda","Tercera","Merma","Total","%Primera"].concat(TODOS_DEFECTOS_COLS,RECHAZOS,["BajoPeso20","BolsasBajoPeso","BajoPesoCustomPack","PiezasBajasCustomPack","PesoPromBolsa","PiezasPromBolsa"]);

  }

                      <div style={{background:"rgba(0,0,0,0.2)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:6,padding:"6px 8px",textAlign:"center"}}>
                        <div style={{fontSize:14,color:"#4a5568",textTransform:"uppercase",letterSpacing:1,marginBottom:2}}>Peso promedio</div>
                        <div style={{fontSize:28,fontWeight:900,color:"#f0ece6",fontFamily:"Georgia,serif"}}>{avgPeso>0?f1(avgPeso):"-"}</div>
                        <div style={{fontSize:15,color:"#4a5568"}}>{unidadPeso(h.producto||"",h.presentacion,h.cliente)}</div>
                      </div>
                    </div>
                    {isOpen&&topDefs.length>0&&(
                      <div>
                        <div style={{fontSize:14,color:"#4a5568",textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>Defectos historicos principales</div>
                        {topDefs.map(function(d,j){
                          var cols=["#f59e0b","#94a3b8","#6b7280","#4a5568"];
                          return (
                            <div key={j} style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                              <span style={{fontSize:15,color:cols[j]||"#6b7280",minWidth:110}}>{d.d}</span>
                              <div style={{flex:1,height:5,background:"rgba(255,255,255,0.08)",borderRadius:3,overflow:"hidden"}}>
                                <div style={{height:"100%",width:Math.min(100,parseFloat(d.p)*3)+"%",background:cols[j]||"#6b7280",borderRadius:3}}/>
                              </div>
                              <span style={{fontSize:16,fontWeight:700,color:cols[j]||"#6b7280",minWidth:40,textAlign:"right"}}>{d.p}%</span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
              );
            })
          }
        </div>
      )}

      </div>
    {showPinQCT&&<ModalPinQCT onOk={function(){pinOkQCT();}} onCancel={function(){setShowPinQCT(false);setPinCbQCT(null);}}/>}
    {editando&&editEvActual&&<ModalEditarEval ev={editEvActual} producto={editProducto} presentacion={editPresentacion} cliente={editCliente} onSave={guardarEdicionEval} onCancel={function(){setEditando(null);}}/>}
    </div>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
